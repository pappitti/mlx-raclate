[project]
name = "mlx-raclate"
version = "0.1.0b1"
description = "Raclate is a python library to run and train models for Retrieval and Classification, built on top of MLX."
readme = "README.md"
authors = [
    { name = "pappitti", email = "pap@pitti.io" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.15.0",
    "mlx>=0.31.0",
    "numpy>=2.0.2",
    "transformers>=5.8.1",
]

[project.optional-dependencies]
train = ["datasets>=4.4.1"]
serve = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
]
all = [
    "datasets>=4.4.1",
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
]

[project.scripts]
raclate = "mlx_raclate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datasets>=4.4.1",
    "fastapi>=0.121.3",
    "pytest>=9.0.1",
    "ruff>=0.14.5",
    "uvicorn>=0.38.0",
]
reference = [
    "polars>=1.36.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
