[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    release: lean publishability contract; no model downloads
    slow: marks tests as slow (require model downloads, deselect with '-m "not slow"')
    integration: crosses package or service boundaries
    recipe: repository recipe/tool check, not an installed-package contract

# Default options
addopts = --tb=short --strict-markers

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
